<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./Assets/Calculator_512.png">
    <title>Calculator App</title>
</head>
<body>
    
    <div class="calculator-container">
        <div class="calculator-top">
            <input type="text" name="display" id="display" readonly>
        </div>
        <div class="btn-row">
            <input type="button" value="AC" class="top-btn" onclick="display.value = ``">
            <input type="button" value="DE" class="top-btn" onclick="display.value = display.value.toString().slice(0,-1)">
            <input type="button" value="." class="top-btn" onclick="display.value += `${this.value}`">
            <input type="button" value="/" onclick="display.value += `${this.value}`">
        </div>
        <div class="btn-row">
            <input type="button" value="7" onclick="display.value += `${this.value}`">
            <input type="button" value="8" onclick="display.value += `${this.value}`">
            <input type="button" value="9" onclick="display.value += `${this.value}`">
            <input type="button" value="*" onclick="display.value += `${this.value}`">
        </div>
        <div class="btn-row">
            <input type="button" value="4" onclick="display.value += `${this.value}`">
            <input type="button" value="5" onclick="display.value += `${this.value}`">
            <input type="button" value="6" onclick="display.value += `${this.value}`">
            <input type="button" value="-" onclick="display.value += `${this.value}`">
        </div>
        <div class="btn-row">
            <input type="button" value="1" onclick="display.value += `${this.value}`">
            <input type="button" value="2" onclick="display.value += `${this.value}`">
            <input type="button" value="3" onclick="display.value += `${this.value}`">
            <input type="button" value="+" onclick="display.value += `${this.value}`">
        </div>
        <div class="btn-row">
            <input type="button" value="00" onclick="display.value += `${this.value}`">
            <input type="button" value="0" onclick="display.value += `${this.value}`">
            <input type="button" value="=" class="equal" onclick="display.value = eval(display.value)">
        </div>
    </div>

<script src="./javascript.js"></script>
</body>
</html>
