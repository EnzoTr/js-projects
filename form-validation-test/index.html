<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./Assets/icon.png">
    <title>Test | Sign Up</title>
</head>
<body>
    <section id="form">
        <div class="image-section">
            <img class="img-bg" src="Assets/3d.jpg" alt="">
            <img class="img-logo" src="./Assets/Isotipo White.svg" alt="">
            <h3>Capturing Moments, <br>Creating Memories</h3>
        </div>
        <form action="" class="form">
            <h2>Create an account</h2>
            <p>Already have an account? <span>Log in</span></p>
            <div class="input-container">
                <div class="input-name-container">
                    <div class="input-wrapper">
                        <input type="text" placeholder="First name" id="firstName" onkeyup="validateFName()">
                        <span id="fname-error"></span>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Last name" id="lastName" onkeyup="validateLName()">
                        <span id="lname-error"></span>
                    </div>
                </div>
                <div class="input-wrapper">
                    <input type="text" placeholder="Phone number" id="phoneNumber" onkeyup="validatePhone()">
                    <span id="phone-error"></span>
                </div>
                <div class="input-wrapper">
                    <input type="text" placeholder="Email" id="email" onkeyup="validateEmail()">
                    <span id="email-error"></span>
                </div>
                <div class="input-wrapper">
                    <input type="password" placeholder="Enter your password" id="password" onkeyup="validatePassword()">
                    <span id="password-error"></span>
                </div>
                
            </div>
            <button onclick="return validateForm()">Create account</button>
        </form>
    </section>
<script src="./javascript.js"></script>
</body>
</html>
