<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./Assets/icon.png">
    <script src="https://kit.fontawesome.com/7156b5f9cf.js" crossorigin="anonymous"></script>
    <title>Music Player</title>
</head>
<body>

    <div class="player-container">
        <div class="player">
            <!-- <nav class="top-icons">
                <i class="fa-solid fa-angle-left"></i>
                <i class="fa-solid fa-ellipsis"></i>
            </nav> -->
            <img src="./Assets/cover.jpg" alt="Cover">
            <h2>Kyoto</h2>
            <p>Omar Courtz, De La Rose & Haze</p>
            <audio id="song">
                <source src="./Assets/kyoto.mp3" type="audio/mpeg">
            </audio>
            <input type="range" value="0" min="0" max="100" id="progress-bar">
            <div class="player-controls">
                <i class="fa-solid fa-backward"></i>
                <i class="fa-solid fa-play" id="playIcon" onclick="playPause()"></i>
                <!-- <i class="fa-solid fa-pause"></i> -->
                <i class="fa-solid fa-forward"></i>
            </div>
            <div class="volume-control">
                <i class="fa-solid fa-volume-off"></i>
                <input type="range" value="0" min="0" max="100" id="volume-bar">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>
    </div>
    
<script src="./javascript.js"></script>
</body>
</html>
