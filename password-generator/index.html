<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="icon" href="Assets/icon.png" type="icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="main-container">

        <h1 class="title1">
            Generate a
        </h1>
        <h1 class="title2">
            Random Password
        </h1>

        <div class="input-container">
            <input type="text" placeholder="Password" id="password">
            <img src="Assets/copy.png" alt="">
        </div>

        <button class="generate-btn"><img src="Assets/generate.png" alt="" class="btn-img">Generate Password</button>

        <div class="controls-container">
            <ul>
                <li class="pwdLength">
                    <input type="range" name="Length" min="10" max="25" step="1" id="inputLength">
                    <p>Length: <output id="pwdLength"></output></p>
                </li>
                <li>
                    <input type="checkbox" id="uppercase"> Uppercase
                </li>
                <li>
                    <input type="checkbox" id="numbers"> Numbers
                </li>
                <li>
                    <input type="checkbox" id="symbols"> Symbols
                </li>
            </ul>
        </div>
        
    </div>

    <script src="javascript.js"></script>
</body>
</html>
