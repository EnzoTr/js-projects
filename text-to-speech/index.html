<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" href="./Assets/icon.png">
    <script src="https://kit.fontawesome.com/7156b5f9cf.js" crossorigin="anonymous"></script>
</head>
<body class="
    w-screen
    h-screen
    bg-linear-to-r from-cyan-600 to-sky-600
    text-white
    flex
    justify-center
    items-center
    m-auto
">  
    <div class="
        flex
        flex-col
        gap-7
        h-[90%]
        max-h-[30em]
        w-[90%]
        max-w-[40em]
    ">
        <h1 class="
            font-bold
            mb-4
            text-center
            text-4xl
        ">
            Text to Speech <span class="text-orange-500">Converter</span>
        </h1>
        <textarea id="text-area" placeholder="Write anything here..." class="
            bg-indigo-50/20
            rounded-2xl
            w-full
            h-full
            px-4
            py-3
            outline-0
            max-h-[20em]
        "></textarea>
        <div class="flex gap-x-6">
            <select id="select-voice" name="language" id="select-language" class="
                bg-indigo-50/20
                rounded-3xl
                px-6
                py-3
                flex-1
                w-[100%]
                outline-0
            ">
            
            </select>
            <button id="play-btn" class="
                bg-orange-500
                rounded-3xl
                px-6
                py-3
                gap-3
                flex
                items-center
                cursor-pointer
            "><i class="fa-solid fa-play"></i> Listen</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
